# Optional Render Blueprint for the Static Site. Values below match package.json
# ("build" script) and Vite's default output folder (dist).
# Secret/env values are set in the Render dashboard, never committed.
services:
  - type: web
    runtime: static
    name: panganganeslibrary
    # Uses the clean, lockfile-exact install when package-lock.json is committed (it should be),
    # and falls back to npm install so the very first build cannot fail on a missing lockfile.
    buildCommand: if [ -f package-lock.json ]; then npm ci; else npm install; fi && npm run build
    staticPublishPath: dist
    # React Router: serve index.html for any client path (Rewrite, not Redirect).
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: X-Frame-Options
        value: DENY
      # Never cache service worker so updates are picked up instantly
      - path: /sw.js
        name: Cache-Control
        value: no-cache, no-store, must-revalidate
    envVars:
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
